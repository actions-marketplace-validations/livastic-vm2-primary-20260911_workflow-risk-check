name: "Workflow Risk Check CI — Local-First Security Preflight"
description: "Local-first GitHub Actions YAML checks for token permissions, mutable actions and PR trust boundaries. No uploads."
author: "Workflow Risk Check"
inputs:
  directory:
    description: "Path relative to the checkout root containing workflow YAML files."
    required: false
    default: ".github/workflows"
  fail_level:
    description: "Exit with a failure if findings at or above this level exist: high, medium, or none."
    required: false
    default: "high"
  max_files:
    description: "Maximum number of workflow YAML files to read (1–100)."
    required: false
    default: "40"
  sarif_file:
    description: "Optional repository-relative .sarif file path. Leave blank to disable SARIF output."
    required: false
    default: ""
outputs:
  high_count:
    description: "Total high-severity findings."
  medium_count:
    description: "Total medium-severity findings."
  note_count:
    description: "Total advisory findings."
  files_scanned:
    description: "Number of checked YAML files."
  sarif_path:
    description: "Repository-relative SARIF output path (present only when sarif_file is configured)."
runs:
  using: "node24"
  main: "dist/index.cjs"
branding:
  icon: "shield"
  color: "blue"
